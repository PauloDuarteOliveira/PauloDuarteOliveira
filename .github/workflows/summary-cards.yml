# Put this file in your profile repository as .github/workflows/summary-cards.yml
# Every day (and when you run it by hand) it draws your stats and languages cards
# and saves them in the folder profile-summary-card-output/, which the README shows.
name: Profile summary cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
